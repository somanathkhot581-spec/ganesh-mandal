<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Expenses - Hindustan Ganesh Mandal Karadaga</title>
<link rel="stylesheet" href="/css/style.css">
</head>
<body>
<div id="layout-root"></div>
<div class="container">
    <div class="page-title">
        <div>
            <h2>Expenses</h2>
            <p>Record and manage every Mandal expense</p>
        </div>
        <button class="btn btn-primary" id="add-expense-btn">+ Add Expense</button>
    </div>

    <div class="card" style="margin-bottom:18px;">
        <div class="filters">
            <div class="field">
                <label>Search description / vendor</label>
                <input type="text" id="f-search" placeholder="e.g. decoration lights">
            </div>
            <div class="field">
                <label>From date</label>
                <input type="date" id="f-from">
            </div>
            <div class="field">
                <label>To date</label>
                <input type="date" id="f-to">
            </div>
            <div class="field">
                <label>Category</label>
                <select id="f-category"><option value="">All</option></select>
            </div>
            <div class="field">
                <label>Year</label>
                <select id="f-year"></select>
            </div>
            <div class="field" style="flex:0;">
                <label>&nbsp;</label>
                <button class="btn btn-secondary" id="clear-filters">Clear</button>
            </div>
        </div>
    </div>

    <div id="loading" class="spinner"></div>

    <div id="table-card" class="card hidden">
        <div class="table-wrap">
            <table>
                <thead>
                    <tr>
                        <th>Category</th><th>Description</th><th>Amount</th><th>Date</th><th>Paid To</th><th>Bill</th><th>Actions</th>
                    </tr>
                </thead>
                <tbody id="expenses-body"></tbody>
            </table>
        </div>
        <div id="empty-state" class="empty-state hidden">No expenses found. Try adjusting filters or add a new expense.</div>
    </div>
</div>

<!-- Add/Edit Modal -->
<div class="modal-backdrop hidden" id="expense-modal">
    <div class="modal" style="max-width:560px;">
        <h3 id="modal-title">Add Expense</h3>
        <form id="expense-form">
            <input type="hidden" id="expense-id">
            <div class="form-grid cols-2">
                <div>
                    <label for="category_id">Category *</label>
                    <select id="category_id" required></select>
                </div>
                <div>
                    <label for="amount">Amount Spent (₹) *</label>
                    <input type="number" id="amount" required min="1" step="0.01">
                </div>
                <div>
                    <label for="date">Date *</label>
                    <input type="date" id="date" required>
                </div>
                <div>
                    <label for="payment_method">Payment Method *</label>
                    <select id="payment_method" required>
                        <option value="Cash">Cash</option>
                        <option value="UPI">UPI</option>
                        <option value="Bank Transfer">Bank Transfer</option>
                        <option value="Other">Other</option>
                    </select>
                </div>
                <div>
                    <label for="paid_to">Paid To / Vendor Name</label>
                    <input type="text" id="paid_to" maxlength="120">
                </div>
                <div>
                    <label for="receipt_file">Upload Bill / Receipt (PDF/Image)</label>
                    <input type="file" id="receipt_file" accept=".pdf,.png,.jpg,.jpeg,.webp">
                    <div id="existing-file" class="muted" style="font-size:12.5px; margin-top:4px;"></div>
                </div>
            </div>
            <div style="margin-top:14px;">
                <label for="description">Description</label>
                <textarea id="description" maxlength="300"></textarea>
            </div>
            <div style="margin-top:14px;">
                <label for="notes">Notes (optional)</label>
                <textarea id="notes" maxlength="300"></textarea>
            </div>
            <div class="form-actions">
                <button type="button" class="btn btn-secondary" id="cancel-modal">Cancel</button>
                <button type="submit" class="btn btn-primary" id="save-expense-btn">Save Expense</button>
            </div>
        </form>
    </div>
</div>

<div id="toast-container"></div>
<script src="/js/common.js"></script>
<script src="/js/layout.js"></script>
<script>
let allExpenses = [];
let allCategories = [];

async function loadCategories() {
    allCategories = await Api.get('/api/categories');
    const filterSel = document.getElementById('f-category');
    const formSel = document.getElementById('category_id');
    const options = allCategories.map(c => `<option value="${c.id}">${escapeHtml(c.name)}</option>`).join('');
    filterSel.innerHTML = '<option value="">All</option>' + options;
    formSel.innerHTML = options;
}

async function loadExpenses() {
    const params = new URLSearchParams();
    const search = document.getElementById('f-search').value.trim();
    const from = document.getElementById('f-from').value;
    const to = document.getElementById('f-to').value;
    const category = document.getElementById('f-category').value;
    const year = document.getElementById('f-year').value;
    if (search) params.set('search', search);
    if (from) params.set('from', from);
    if (to) params.set('to', to);
    if (category) params.set('category', category);
    if (year && year !== 'all') params.set('year', year);

    document.getElementById('loading').classList.remove('hidden');
    document.getElementById('table-card').classList.add('hidden');
    try {
        allExpenses = await Api.get('/api/expenses?' + params.toString());
        renderTable();
    } catch (err) {
        toast(err.message, 'error');
    } finally {
        document.getElementById('loading').classList.add('hidden');
        document.getElementById('table-card').classList.remove('hidden');
    }
}

function renderTable() {
    const body = document.getElementById('expenses-body');
    const empty = document.getElementById('empty-state');
    if (allExpenses.length === 0) {
        body.innerHTML = '';
        empty.classList.remove('hidden');
        return;
    }
    empty.classList.add('hidden');
    body.innerHTML = allExpenses.map(e => `
        <tr>
            <td data-label="Category"><span class="badge">${escapeHtml(e.category_name)}</span></td>
            <td data-label="Description">${escapeHtml(e.description || '-')}</td>
            <td data-label="Amount" class="amount-cell">${Money.format(e.amount)}</td>
            <td data-label="Date">${formatDate(e.date)}</td>
            <td data-label="Paid To">${escapeHtml(e.paid_to || '-')}</td>
            <td data-label="Bill">${e.receipt_file ? `<a href="/uploads/${encodeURIComponent(e.receipt_file)}" target="_blank">View</a>` : '-'}</td>
            <td data-label="Actions">
                <div class="flex gap-8">
                    <button class="btn btn-secondary btn-sm" onclick="editExpense(${e.id})">Edit</button>
                    <button class="btn btn-danger btn-sm" onclick="deleteExpense(${e.id})">Delete</button>
                </div>
            </td>
        </tr>
    `).join('');
}

function openModal(expense) {
    document.getElementById('expense-modal').classList.remove('hidden');
    document.getElementById('receipt_file').value = '';
    if (expense) {
        document.getElementById('modal-title').textContent = 'Edit Expense';
        document.getElementById('expense-id').value = expense.id;
        document.getElementById('category_id').value = expense.category_id;
        document.getElementById('amount').value = expense.amount;
        document.getElementById('date').value = expense.date;
        document.getElementById('payment_method').value = expense.payment_method;
        document.getElementById('paid_to').value = expense.paid_to || '';
        document.getElementById('description').value = expense.description || '';
        document.getElementById('notes').value = expense.notes || '';
        document.getElementById('existing-file').textContent = expense.receipt_file
            ? `Current file: ${expense.receipt_file} (uploading a new one will replace it)`
            : 'No file uploaded yet.';
    } else {
        document.getElementById('modal-title').textContent = 'Add Expense';
        document.getElementById('expense-form').reset();
        document.getElementById('expense-id').value = '';
        document.getElementById('date').value = todayIso();
        document.getElementById('existing-file').textContent = '';
    }
}
function closeModal() {
    document.getElementById('expense-modal').classList.add('hidden');
}

function editExpense(id) {
    const e = allExpenses.find(x => x.id === id);
    if (e) openModal(e);
}

async function deleteExpense(id) {
    const e = allExpenses.find(x => x.id === id);
    const ok = await confirmAction({
        title: 'Delete expense?',
        message: `This will permanently delete the expense of ${Money.format(e.amount)} (${e.category_name}).`,
        confirmText: 'Delete'
    });
    if (!ok) return;
    try {
        await Api.del(`/api/expenses/${id}`);
        toast('Expense deleted.', 'success');
        loadExpenses();
    } catch (err) {
        toast(err.message, 'error');
    }
}

document.getElementById('add-expense-btn').addEventListener('click', () => openModal(null));
document.getElementById('cancel-modal').addEventListener('click', closeModal);
document.getElementById('expense-modal').addEventListener('click', (e) => {
    if (e.target.id === 'expense-modal') closeModal();
});

document.getElementById('expense-form').addEventListener('submit', async (e) => {
    e.preventDefault();
    const id = document.getElementById('expense-id').value;
    const amount = document.getElementById('amount').value;
    if (Number(amount) <= 0) {
        toast('Expense amount must be greater than zero.', 'error');
        return;
    }
    const formData = new FormData();
    formData.append('category_id', document.getElementById('category_id').value);
    formData.append('amount', amount);
    formData.append('date', document.getElementById('date').value);
    formData.append('payment_method', document.getElementById('payment_method').value);
    formData.append('paid_to', document.getElementById('paid_to').value.trim());
    formData.append('description', document.getElementById('description').value.trim());
    formData.append('notes', document.getElementById('notes').value.trim());
    const file = document.getElementById('receipt_file').files[0];
    if (file) formData.append('receipt_file', file);

    const btn = document.getElementById('save-expense-btn');
    btn.disabled = true;
    try {
        if (id) {
            await Api.putForm(`/api/expenses/${id}`, formData);
            toast('Expense updated.', 'success');
        } else {
            await Api.postForm('/api/expenses', formData);
            toast('Expense added.', 'success');
        }
        closeModal();
        loadExpenses();
    } catch (err) {
        toast(err.message, 'error');
    } finally {
        btn.disabled = false;
    }
});

['f-search', 'f-from', 'f-to'].forEach(id => {
    document.getElementById(id).addEventListener('input', debounce(loadExpenses, 250));
});
document.getElementById('f-category').addEventListener('change', loadExpenses);
document.getElementById('f-year').addEventListener('change', loadExpenses);
document.getElementById('f-from').addEventListener('change', loadExpenses);
document.getElementById('f-to').addEventListener('change', loadExpenses);
document.getElementById('clear-filters').addEventListener('click', () => {
    document.getElementById('f-search').value = '';
    document.getElementById('f-from').value = '';
    document.getElementById('f-to').value = '';
    document.getElementById('f-category').value = '';
    document.getElementById('f-year').value = 'all';
    loadExpenses();
});

function debounce(fn, ms) {
    let t;
    return (...args) => { clearTimeout(t); t = setTimeout(() => fn(...args), ms); };
}

(async function () {
    const session = await initProtectedPage();
    if (!session) return;
    await loadCategories();
    await populateYearSelect(document.getElementById('f-year'), { selected: 'all' });
    loadExpenses();
})();
</script>
</body>
</html>
