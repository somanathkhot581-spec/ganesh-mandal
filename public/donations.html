<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Donations - Hindustan Ganesh Mandal Karadaga</title>
<link rel="stylesheet" href="/css/style.css">
</head>
<body>
<div id="layout-root"></div>
<div class="container">
    <div class="page-title">
        <div>
            <h2>Donations</h2>
            <p>Record and manage donations received by the Mandal</p>
        </div>
        <button class="btn btn-primary" id="add-donation-btn">+ Add Donation</button>
    </div>

    <div class="card" style="margin-bottom:18px;">
        <div class="filters">
            <div class="field">
                <label>Search donor name</label>
                <input type="text" id="f-search" placeholder="e.g. Sharma">
            </div>
            <div class="field">
                <label>From date</label>
                <input type="date" id="f-from">
            </div>
            <div class="field">
                <label>To date</label>
                <input type="date" id="f-to">
            </div>
            <div class="field">
                <label>Payment method</label>
                <select id="f-method">
                    <option value="">All</option>
                    <option value="Cash">Cash</option>
                    <option value="UPI">UPI</option>
                    <option value="Bank Transfer">Bank Transfer</option>
                    <option value="Other">Other</option>
                </select>
            </div>
            <div class="field">
                <label>Year</label>
                <select id="f-year"></select>
            </div>
            <div class="field" style="flex:0;">
                <label>&nbsp;</label>
                <button class="btn btn-secondary" id="clear-filters">Clear</button>
            </div>
        </div>
    </div>

    <div id="loading" class="spinner"></div>

    <div id="table-card" class="card hidden">
        <div class="table-wrap">
            <table>
                <thead>
                    <tr>
                        <th>Donor</th><th>Mobile</th><th>Amount</th><th>Date</th><th>Method</th><th>Notes</th><th>Actions</th>
                    </tr>
                </thead>
                <tbody id="donations-body"></tbody>
            </table>
        </div>
        <div id="empty-state" class="empty-state hidden">No donations found. Try adjusting filters or add a new donation.</div>
    </div>
</div>

<!-- Add/Edit Modal -->
<div class="modal-backdrop hidden" id="donation-modal">
    <div class="modal" style="max-width:520px;">
        <h3 id="modal-title">Add Donation</h3>
        <form id="donation-form">
            <input type="hidden" id="donation-id">
            <div class="form-grid cols-2">
                <div>
                    <label for="donor_name">Donor Name *</label>
                    <input type="text" id="donor_name" required maxlength="120">
                </div>
                <div>
                    <label for="mobile">Mobile Number (optional)</label>
                    <input type="tel" id="mobile" maxlength="15" placeholder="9876543210">
                </div>
                <div>
                    <label for="amount">Donation Amount (₹) *</label>
                    <input type="number" id="amount" required min="1" step="0.01">
                </div>
                <div>
                    <label for="date">Date *</label>
                    <input type="date" id="date" required>
                </div>
                <div>
                    <label for="payment_method">Payment Method *</label>
                    <select id="payment_method" required>
                        <option value="Cash">Cash</option>
                        <option value="UPI">UPI</option>
                        <option value="Bank Transfer">Bank Transfer</option>
                        <option value="Other">Other</option>
                    </select>
                </div>
            </div>
            <div style="margin-top:14px;">
                <label for="notes">Notes (optional)</label>
                <textarea id="notes" maxlength="300"></textarea>
            </div>
            <div class="form-actions">
                <button type="button" class="btn btn-secondary" id="cancel-modal">Cancel</button>
                <button type="submit" class="btn btn-primary" id="save-donation-btn">Save Donation</button>
            </div>
        </form>
    </div>
</div>

<div id="toast-container"></div>
<script src="/js/common.js"></script>
<script src="/js/layout.js"></script>
<script>
let allDonations = [];

async function loadDonations() {
    const params = new URLSearchParams();
    const search = document.getElementById('f-search').value.trim();
    const from = document.getElementById('f-from').value;
    const to = document.getElementById('f-to').value;
    const method = document.getElementById('f-method').value;
    const year = document.getElementById('f-year').value;
    if (search) params.set('search', search);
    if (from) params.set('from', from);
    if (to) params.set('to', to);
    if (method) params.set('method', method);
    if (year && year !== 'all') params.set('year', year);

    document.getElementById('loading').classList.remove('hidden');
    document.getElementById('table-card').classList.add('hidden');
    try {
        allDonations = await Api.get('/api/donations?' + params.toString());
        renderTable();
    } catch (err) {
        toast(err.message, 'error');
    } finally {
        document.getElementById('loading').classList.add('hidden');
        document.getElementById('table-card').classList.remove('hidden');
    }
}

function renderTable() {
    const body = document.getElementById('donations-body');
    const empty = document.getElementById('empty-state');
    if (allDonations.length === 0) {
        body.innerHTML = '';
        empty.classList.remove('hidden');
        return;
    }
    empty.classList.add('hidden');
    body.innerHTML = allDonations.map(d => `
        <tr>
            <td data-label="Donor">${escapeHtml(d.donor_name)}</td>
            <td data-label="Mobile">${escapeHtml(d.mobile || '-')}</td>
            <td data-label="Amount" class="amount-cell">${Money.format(d.amount)}</td>
            <td data-label="Date">${formatDate(d.date)}</td>
            <td data-label="Method"><span class="badge ${paymentBadgeClass(d.payment_method)}">${escapeHtml(d.payment_method)}</span></td>
            <td data-label="Notes">${escapeHtml(d.notes || '-')}</td>
            <td data-label="Actions">
                <div class="flex gap-8">
                    <button class="btn btn-secondary btn-sm" onclick="viewReceipt(${d.id})">Receipt</button>
                    <button class="btn btn-secondary btn-sm" onclick="editDonation(${d.id})">Edit</button>
                    <button class="btn btn-danger btn-sm" onclick="deleteDonation(${d.id})">Delete</button>
                </div>
            </td>
        </tr>
    `).join('');
}

function viewReceipt(id) {
    window.open(`/receipt.html?id=${id}`, '_blank');
}

function openModal(donation) {
    document.getElementById('donation-modal').classList.remove('hidden');
    if (donation) {
        document.getElementById('modal-title').textContent = 'Edit Donation';
        document.getElementById('donation-id').value = donation.id;
        document.getElementById('donor_name').value = donation.donor_name;
        document.getElementById('mobile').value = donation.mobile || '';
        document.getElementById('amount').value = donation.amount;
        document.getElementById('date').value = donation.date;
        document.getElementById('payment_method').value = donation.payment_method;
        document.getElementById('notes').value = donation.notes || '';
    } else {
        document.getElementById('modal-title').textContent = 'Add Donation';
        document.getElementById('donation-form').reset();
        document.getElementById('donation-id').value = '';
        document.getElementById('date').value = todayIso();
    }
}
function closeModal() {
    document.getElementById('donation-modal').classList.add('hidden');
}

function editDonation(id) {
    const d = allDonations.find(x => x.id === id);
    if (d) openModal(d);
}

async function deleteDonation(id) {
    const d = allDonations.find(x => x.id === id);
    const ok = await confirmAction({
        title: 'Delete donation?',
        message: `This will permanently delete the donation of ${Money.format(d.amount)} from ${d.donor_name}.`,
        confirmText: 'Delete'
    });
    if (!ok) return;
    try {
        await Api.del(`/api/donations/${id}`);
        toast('Donation deleted.', 'success');
        loadDonations();
    } catch (err) {
        toast(err.message, 'error');
    }
}

document.getElementById('add-donation-btn').addEventListener('click', () => openModal(null));
document.getElementById('cancel-modal').addEventListener('click', closeModal);
document.getElementById('donation-modal').addEventListener('click', (e) => {
    if (e.target.id === 'donation-modal') closeModal();
});

document.getElementById('donation-form').addEventListener('submit', async (e) => {
    e.preventDefault();
    const id = document.getElementById('donation-id').value;
    const payload = {
        donor_name: document.getElementById('donor_name').value.trim(),
        mobile: document.getElementById('mobile').value.trim(),
        amount: document.getElementById('amount').value,
        date: document.getElementById('date').value,
        payment_method: document.getElementById('payment_method').value,
        notes: document.getElementById('notes').value.trim()
    };
    if (Number(payload.amount) <= 0) {
        toast('Donation amount must be greater than zero.', 'error');
        return;
    }
    const btn = document.getElementById('save-donation-btn');
    btn.disabled = true;
    try {
        if (id) {
            await Api.put(`/api/donations/${id}`, payload);
            toast('Donation updated.', 'success');
        } else {
            await Api.post('/api/donations', payload);
            toast('Donation added.', 'success');
        }
        closeModal();
        loadDonations();
    } catch (err) {
        toast(err.message, 'error');
    } finally {
        btn.disabled = false;
    }
});

['f-search', 'f-from', 'f-to', 'f-method', 'f-year'].forEach(id => {
    document.getElementById(id).addEventListener('input', debounce(loadDonations, 250));
    document.getElementById(id).addEventListener('change', loadDonations);
});
document.getElementById('clear-filters').addEventListener('click', () => {
    document.getElementById('f-search').value = '';
    document.getElementById('f-from').value = '';
    document.getElementById('f-to').value = '';
    document.getElementById('f-method').value = '';
    document.getElementById('f-year').value = 'all';
    loadDonations();
});

function debounce(fn, ms) {
    let t;
    return (...args) => { clearTimeout(t); t = setTimeout(() => fn(...args), ms); };
}

(async function () {
    const session = await initProtectedPage();
    if (!session) return;
    await populateYearSelect(document.getElementById('f-year'), { selected: 'all' });
    loadDonations();
})();
</script>
</body>
</html>
